<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Índice Biblioteca</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/public.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container">
      <p class="site-title">Índice Biblioteca</p>
    </div>
  </header>
  <main id="contenido" class="container">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <div id="mensajes" aria-live="polite"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Nombre de usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" aria-describedby="username-error">
          <p id="username-error" class="field-error" hidden></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
          <p id="password-error" class="field-error" hidden></p>
        </div>
        <button id="submit" class="btn btn-primary" type="submit">Iniciar sesión</button>
      </form>
      <p class="auth-links"><a href="./index.html">Volver a la búsqueda</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">Índice Biblioteca</div>
  </footer>
  <script type="module" src="./js/admin/auth.js"></script>
</body>
</html>
