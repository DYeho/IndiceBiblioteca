<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Índice Biblioteca · Iniciar sesión</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/public.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="container site-header-inner">
      <p><strong>Índice Biblioteca</strong></p>
    </div>
  </header>

  <main class="site-main" id="contenido">
    <div class="container">
      <div class="login-main stack">

        <div class="page-intro">
          <h1>Iniciar sesión</h1>
          <p>Acceso para Administración.</p>
        </div>

        <div class="alert alert-error" role="alert">
          <strong>Error:</strong> Usuario o contraseña incorrectos.
        </div>

        <form class="login-form" method="post">
          <div class="form-field">
            <label class="form-label" for="username">Usuario</label>
            <input
              class="form-input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-field">
            <label class="form-label" for="password">Contraseña</label>
            <input
              class="form-input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button class="button button-primary" type="submit">Entrar</button>
        </form>

        <p><a href="/">← Volver al catálogo</a></p>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Catálogo de la biblioteca estudiantil</p>
    </div>
  </footer>
</body>
</html>
