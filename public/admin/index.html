<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Índice Biblioteca</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container">
      <p class="site-title">Índice Biblioteca · Administración</p>
      <nav class="admin-nav" aria-label="Administración">
        <button type="button" class="btn btn-secondary" data-section="buscar" aria-current="page">Buscar libros</button>
        <button type="button" class="btn btn-secondary" data-section="registrar">Registrar libro</button>
        <button type="button" class="btn btn-secondary" id="logout">Cerrar sesión</button>
      </nav>
    </div>
  </header>
  <main id="contenido" class="container">
    <div id="mensajes" aria-live="polite"></div>
    <section id="seccion-buscar" class="admin-section" aria-labelledby="titulo-buscar">
      <h1 id="titulo-buscar">Buscar libros</h1>
    </section>
    <section id="seccion-registrar" class="admin-section" aria-labelledby="titulo-registrar" hidden>
      <h2 id="titulo-registrar">Registrar libro</h2>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">Índice Biblioteca</div>
  </footer>
  <script type="module" src="../js/admin/main.js"></script>
</body>
</html>
