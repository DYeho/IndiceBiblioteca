<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Índice Biblioteca · Encuentra tu libro</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/public.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="container site-header-inner">
      <p><strong>Índice Biblioteca</strong></p>
      <nav aria-label="Principal">
        <a href="./login.html">Acceso Administración</a>
      </nav>
    </div>
  </header>

  <main class="site-main" id="contenido">
    <div class="container stack">

      <div class="page-intro">
        <h1>Encuentra tu libro</h1>
        <p>Busca por título o autor y mira en qué estante está.</p>
      </div>

      <form class="form-field" role="search">
        <label class="form-label" for="search-input">Buscar por título o autor</label>
        <div class="search-form">
          <input
            class="form-input search-input"
            id="search-input"
            name="q"
            type="search"
            autocomplete="off"
          >
          <button class="button button-primary" type="submit">Buscar</button>
        </div>
      </form>

      <div class="search-layout">

        <section class="search-results stack" aria-label="Resultados de búsqueda">
          <p class="results-summary" role="status" aria-live="polite">4 resultados</p>

          <ul class="results-grid">
            <li>
              <button class="book-card" type="button" aria-current="true">
                <span class="book-card-title">Cien años de soledad</span>
                <span class="book-card-author">Gabriel García Márquez</span>
                <span class="book-card-shelf">Estante A-3</span>
              </button>
            </li>
            <li>
              <button class="book-card" type="button">
                <span class="book-card-title">El principito</span>
                <span class="book-card-author">Antoine de Saint-Exupéry</span>
                <span class="book-card-shelf">Estante B-1</span>
                <span class="badge-out-of-stock">Agotado</span>
              </button>
            </li>
            <li>
              <button class="book-card" type="button">
                <span class="book-card-title">Don Quijote de la Mancha</span>
                <span class="book-card-author">Miguel de Cervantes Saavedra</span>
                <span class="book-card-author">Sin estante asignado</span>
              </button>
            </li>
            <li>
              <button class="book-card" type="button">
                <span class="book-card-title">Rayuela</span>
                <span class="book-card-author">Julio Cortázar</span>
                <span class="book-card-shelf">Estante C-2</span>
              </button>
            </li>
          </ul>
        </section>

        <aside class="detail-region" aria-label="Detalle del libro">
          <div class="detail-panel">
            <div class="detail-header">
              <h2 class="detail-title">Cien años de soledad</h2>
              <button class="button button-secondary" type="button">Cerrar</button>
            </div>

            <dl class="detail-list">
              <div>
                <dt class="detail-term">Autor</dt>
                <dd class="detail-value">Gabriel García Márquez</dd>
              </div>
              <div>
                <dt class="detail-term">Estante</dt>
                <dd class="detail-value detail-shelf">A-3</dd>
              </div>
              <div>
                <dt class="detail-term">Ejemplares</dt>
                <dd class="detail-value">3 disponibles</dd>
              </div>
            </dl>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Catálogo de la biblioteca estudiantil</p>
    </div>
  </footer>
</body>
</html>
